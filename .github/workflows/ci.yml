name: TRON-V3 CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend:
    name: Go Backend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tron-go-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build -v ./cmd/api

  dashboard:
    name: Next.js Dashboard Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tron-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './tron-dashboard/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  extension:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tron-vscode
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './tron-vscode/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile
        run: npm run compile
